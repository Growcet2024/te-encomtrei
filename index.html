/* ===== inicio - CSS DO Calendário ===== */
/* Botão do calendário */
.cal-icon-btn {
  position: fixed;
  top: 0;
  right: 10px;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  cursor: pointer;
  color: #555;
  z-index: 1001;
}

.cal-icon-btn svg {
  width: 22px;
  height: 22px;
}

/* Fundo escuro */
.cal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  z-index: 1000;
}

.cal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

/* Painel: meia tela */
.cal-panel {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  max-height: 50vh;
  overflow-y: auto;
  background: #fff;
  border-radius: 0 0 16px 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  transform: translateY(-100%);
  transition: transform 0.25s ease;
  padding: 16px;
}

.cal-overlay.open .cal-panel {
  transform: translateY(0);
}

/* Cabeçalho */
.cal-panel-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-bottom: 16px;
}

.cal-panel-header button {
  background: none;
  border: none;
  font-size: 24px;
  padding: 6px 12px;
  cursor: pointer;
  color: #333;
}

.cal-panel-title {
  min-width: 125px;
  text-align: center;
  font-size: 18px;
  font-weight: 600;
  color: #222;
}

.cal-month-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

  padding: 12px 0;
  border-radius: 8px;
  border: 1px solid #eee;
  background: #f7f7f7;
  color: #333;
  font-size: 14px;

<script>
/* ✅===== INICIO > MOSTRAR CONTAGEM NA INDEX ===== 1 -(DATA/HORA) */

function atualizarContagemIndex(){

  const dataSalva = localStorage.getItem("data-inicio");
  const horaSalva = localStorage.getItem("hora-inicio");

  if(!dataSalva) return;

  const [year, month, day] =
    dataSalva.split("-").map(Number);

  let hours = 0;
  let minutes = 0;

  if(horaSalva){
    [hours, minutes] =
      horaSalva.split(":").map(Number);
  }

  const specialDate = new Date(
    year,
    month - 1,
    day,
    hours,
    minutes
  );

  const now = new Date();

  function addMonths(date, months){

    const d = new Date(date);
    const day = d.getDate();

    d.setDate(1);
    d.setMonth(d.getMonth() + months);

    const lastDay = new Date(
      d.getFullYear(),
      d.getMonth() + 1,
      0
    ).getDate();

    d.setDate(Math.min(day, lastDay));

    return d;
  }

  let totalMonths =
    (now.getFullYear() - specialDate.getFullYear()) * 12 +
    (now.getMonth() - specialDate.getMonth());

  let anniversary =
    addMonths(specialDate, totalMonths);

  if(anniversary > now){
    totalMonths--;
    anniversary =
      addMonths(specialDate, totalMonths);
  }

  const years =
    Math.floor(totalMonths / 12);

  const months =
    totalMonths % 12;

  let remaining =
    now - anniversary;

  const days =
    Math.floor(
      remaining / (1000 * 60 * 60 * 24)
    );

  remaining %= (1000 * 60 * 60 * 24);

  const hoursNow =
    Math.floor(
      remaining / (1000 * 60 * 60)
    );

  remaining %= (1000 * 60 * 60);

  const minutesNow =
    Math.floor(
      remaining / (1000 * 60)
    );



/* ===== ENVIA PARA O CARD DA INDEX ===== */

document.querySelector(".tempo-ano-index").innerText =
  years + (years === 1 ? " Ano" : " Anos");

const mesesDias =
  document.querySelector(".tempo-meses-dias-index");

const horasMinutos =
  document.querySelector(".tempo-horas-minutos-index");

mesesDias.innerText =
  months + (months === 1 ? " mês" : " meses") +
  " · " +
  days + (days === 1 ? " Dia" : " Dias");

horasMinutos.innerText =
  hoursNow + (hoursNow === 1 ? " Hora" : " Horas") +
  " · " +
  minutesNow + (minutesNow === 1 ? " Minuto" : " Minutos");
}


/* ===== PRIMEIRA ATUALIZAÇÃO ===== */

atualizarContagemIndex();


/* ===== ATUALIZA A CADA MINUTO ===== */

setInterval(atualizarContagemIndex, 60000);
/* ✅===== FIM > MOSTRAR CONTAGEM NA INDEX ===== 1-(DATA/HORA) */
</script>

<script>
/* ✅ ===== inicio — ALIANÇAS REAIS DE NAMORADOS ===== */

window.addEventListener("load", function () {

    const status =
        localStorage.getItem("statusRelacionamento");

    if (status !== "Namorados") return;


    function createRing(size, color, shadow) {

        const ring = document.createElement("div");

        ring.style.width = size + "px";
        ring.style.height = size + "px";
        ring.style.borderRadius = "50%";
        ring.style.position = "fixed";
        ring.style.border = "2px solid " + color;
        ring.style.boxShadow = shadow;
        ring.style.background = "rgba(255,255,255,0.08)";
        ring.style.pointerEvents = "none";
        ring.style.zIndex = "99999";

        document.body.appendChild(ring);

        return ring;
    }


    const size = 42;

    const ring1 = createRing(
        size,
        "#E2E2E2",
        "0 0 10px rgba(255,255,255,0.45)"
    );

    const ring2 = createRing(
        size,
        "#E2E2E2",
        "0 0 10px rgba(255,255,255,0.45)"
    );


    let x = (window.innerWidth - size) / 2;
    let y = (window.innerHeight - size) / 2;

    let vx = 0.8;
    let vy = 0.8;

    const spacing = 35;  // ✅ Espaço entre as alianças


    function update() {

        x += vx;
        y += vy;

        const maxX = window.innerWidth - size;
        const maxY = window.innerHeight - size;


        if (x <= spacing || x >= maxX - spacing) {
            vx *= -1;
        }

        if (y <= 0 || y >= maxY) {
            vy *= -1;
        }


        const t = Date.now();
        const wave = Math.sin(t * 0.002) * 3;


        ring1.style.left =
            (x - spacing) + "px";

        ring1.style.top =
            (y + wave) + "px";

        ring1.style.transform =
            `rotate(${wave}deg)`;


        ring2.style.left =
            (x + spacing) + "px";

        ring2.style.top =
            (y + wave) + "px";

        ring2.style.transform =
            `rotate(${-wave}deg)`;


        requestAnimationFrame(update);
    }


    update();

});
/* ✅ ===== fim — ALIANÇAS REAIS DE NAMORADOS ===== */
</script>

    let baseY = (window.innerHeight - size) / 2;

    let vx = 1.0;

    const spacing = 35;  // ✅ Espaço entre as alianças

        const maxX = window.innerWidth - size;
        const maxY = window.innerHeight - size;

        baseX += vx;
        baseY += vy;


        if (
            baseX <= spacing ||
            baseX >= maxX - spacing
        ) {
            vx *= -1;
        }


        if (
            baseY <= 0 ||
            baseY >= maxY
        ) {
            vy *= -1;
        }


        const t = Date.now();
        const float =
            Math.sin(t * 0.002) * 5;


        ring1.style.left =
            (baseX - spacing) + "px";

        ring1.style.top =
            (baseY + float) + "px";


        ring2.style.left =
            (baseX + spacing) + "px";

        ring2.style.top =
            (baseY + float) + "px";


        ring1.style.transform =
            `rotate(${float}deg)`;

        ring.style.width = size + "px";
        ring.style.height = size + "px";
        ring.style.borderRadius = "50%";
        ring.style.position = "fixed";
        ring.style.pointerEvents = "none";
        ring.style.border = "2px solid " + color;
        ring.style.boxShadow = shadow;
        ring.style.background = "rgba(255,255,255,0.08)";
        ring.style.zIndex = "99999";

        document.body.appendChild(ring);

        return ring;
    }


    const size = 42;

    const ring1 = createRing(
        size,
        "#f7d77a",
        "0 0 10px rgba(255,215,0,0.35)"
    );

    const ring2 = createRing(
        size,
        "#f7d77a",
        "0 0 10px rgba(255,215,0,0.35)"
    );


    const angle1 = -35;
    const angle2 = 35;

    const offsetX = 16;
    const offsetY = 6;


    let x = (window.innerWidth - size) / 2;
    let y = (window.innerHeight - size) / 2;

    let vx = 1.0;
    let vy = 1.0;


    function update() {

        x += vx;
        y += vy;


        const maxX =
            window.innerWidth - size - offsetX;

        const maxY =
            window.innerHeight - size - offsetY;


        if (x <= 0 || x >= maxX) {
            vx *= -1;
        }


        if (y <= 0 || y >= maxY) {
            vy *= -1;
        }


        const t = Date.now();

        const wave =
            Math.sin(t * 0.002) * 3;

        const front =
            Math.sin(t * 0.0015) > 0;


        if (front) {
            ring1.style.zIndex = "99999";
            ring2.style.zIndex = "99998";
        } else {
            ring1.style.zIndex = "99998";
            ring2.style.zIndex = "99999";
        }


        ring1.style.left = x + "px";

        ring1.style.top =
            (y + wave) + "px";

        ring1.style.transform =
            `rotate(${angle1 + wave}deg)`;


        ring2.style.left =
            (x + offsetX) + "px";

        ring2.style.top =
            (y + offsetY - wave) + "px";

        ring2.style.transform =
            `rotate(${angle2 - wave}deg)`;


        requestAnimationFrame(update);
    }


    update();

});
/* ✅ ===== fim — ALIANÇAS REAIS DE CASADOS ===== */
</script>





<!-- ===== SCRIPT calendario DO COMPONENTE (copiar, antes do </body>) ===== -->
<script>
(function () {
  const overlay = document.getElementById('calOverlay');
  const openBtn = document.getElementById('calOpenBtn');
  const prevBtn = document.getElementById('calPrev');
  const nextBtn = document.getElementById('calNext');
  const title = document.getElementById('calTitle');

  const monthView = document.getElementById('calMonthView');
  const dayView = document.getElementById('calDayView');
  const monthGrid = document.getElementById('calMonthGrid');
  const daysGrid = document.getElementById('calDaysGrid');
  const backBtn = document.getElementById('calBackBtn');
  const selectedInfo = document.getElementById('calSelectedInfo');

  const meses = [
    'jan', 'fev', 'mar', 'abr', 'mai', 'jun',
    'jul', 'ago', 'set', 'out', 'nov', 'dez'
  ];

  const nomesMeses = [
    'Janeiro', 'Fevereiro', 'Março', 'Abril',
    'Maio', 'Junho', 'Julho', 'Agosto',
    'Setembro', 'Outubro', 'Novembro', 'Dezembro'
  ];

  const hoje = new Date();

  let mesSelecionado = hoje.getMonth();
  let anoSelecionado = hoje.getFullYear();
  let diaSelecionado = hoje.getDate();

  let mesCalendario = mesSelecionado;
  let anoCalendario = anoSelecionado;

  let visualizacao = 'meses';

  function render() {
    if (visualizacao === 'meses') {
      renderMeses();
    } else {
      renderDias();
    }
  }

  /* =========================
     MOSTRA OS MESES
  ========================= */

  function renderMeses() {
    title.textContent = anoCalendario;

    monthView.hidden = false;
    dayView.hidden = true;

    monthGrid.innerHTML = '';

    meses.forEach(function (nome, indice) {
      const btn = document.createElement('button');

      btn.className = 'cal-month-btn';
      btn.textContent = nome;

      if (
        indice === mesSelecionado &&
        anoCalendario === anoSelecionado
      ) {
        btn.classList.add('selected');
      }

      /*
       * IMPORTANTE:
       * Aqui NÃO fechamos o calendário.
       * Ao clicar, abrimos a tela dos dias.
       */
      btn.addEventListener('click', function () {
        mesCalendario = indice;
        mesSelecionado = indice;
        anoSelecionado = anoCalendario;

        diaSelecionado = 0;
        visualizacao = 'dias';

        render();
      });

      monthGrid.appendChild(btn);
    });
  }

  /* =========================
     MOSTRA OS DIAS
  ========================= */

  function renderDias() {
    title.textContent =
      nomesMeses[mesCalendario] + ' ' + anoCalendario;

    monthView.hidden = true;
    dayView.hidden = false;

    daysGrid.innerHTML = '';

    const primeiroDia = new Date(
      anoCalendario,
      mesCalendario,
      1
    ).getDay();

    const totalDias = new Date(
      anoCalendario,
      mesCalendario + 1,
      0
    ).getDate();

    const diasMesAnterior = new Date(
      anoCalendario,
      mesCalendario,
      0
    ).getDate();

    // Dias do mês anterior.
    for (let i = primeiroDia - 1; i >= 0; i--) {
      criarDia(diasMesAnterior - i, true);
    }

    // Dias do mês selecionado.
    for (let dia = 1; dia <= totalDias; dia++) {
      criarDia(dia, false);
    }

    // Completa a última semana.
    const totalCelulas = primeiroDia + totalDias;
    const restantes = (7 - (totalCelulas % 7)) % 7;

    for (let dia = 1; dia <= restantes; dia++) {
      criarDia(dia, true);
    }

    if (diaSelecionado > 0) {
      selectedInfo.textContent =
        'Dia selecionado: ' +
        diaSelecionado + '/' +
        String(mesCalendario + 1).padStart(2, '0') +
        '/' + anoCalendario;
    } else {
      selectedInfo.textContent = 'Selecione um dia';
    }
  }

  function criarDia(dia, outroMes) {
    const btn = document.createElement('button');

    btn.className = 'cal-day-btn';
    btn.textContent = dia;

    if (outroMes) {
      btn.classList.add('other-month');
      btn.disabled = true;
      daysGrid.appendChild(btn);
      return;
    }

    const ehHoje =
      dia === hoje.getDate() &&
      mesCalendario === hoje.getMonth() &&
      anoCalendario === hoje.getFullYear();

    const ehSelecionado =
      dia === diaSelecionado &&
      mesCalendario === mesSelecionado &&
      anoCalendario === anoSelecionado;

    if (ehHoje) {
      btn.classList.add('today');
    }

    if (ehSelecionado) {
      btn.classList.add('selected-day');
    }

    btn.addEventListener('click', function () {
      diaSelecionado = dia;
      mesSelecionado = mesCalendario;
      anoSelecionado = anoCalendario;

      renderDias();
    });

    daysGrid.appendChild(btn);
  }

  /* =========================
     ABRIR E FECHAR
  ========================= */

  function abrirCalendario() {
    visualizacao = 'meses';
    anoCalendario = anoSelecionado;

    render();

    overlay.classList.add('open');
    openBtn.style.visibility = 'hidden';
  }

  function fecharCalendario() {
    overlay.classList.remove('open');
    openBtn.style.visibility = 'visible';
  }

  openBtn.addEventListener('click', abrirCalendario);

  /*
   * Volta para os meses sem fechar o painel.
   */
  backBtn.addEventListener('click', function () {
    visualizacao = 'meses';
    anoCalendario = anoSelecionado;

    render();
  });

  /*
   * Fecha somente quando clicar fora do painel.
   */
  overlay.addEventListener('click', function (event) {
    if (event.target === overlay) {
      fecharCalendario();
    }
  });

  /* =========================
     NAVEGAÇÃO
  ========================= */

  prevBtn.addEventListener('click', function () {
    if (visualizacao === 'meses') {
      anoCalendario--;
    } else {
      mesCalendario--;

      if (mesCalendario < 0) {
        mesCalendario = 11;
        anoCalendario--;
      }

      diaSelecionado = 0;
    }

    render();
  });

  nextBtn.addEventListener('click', function () {
    if (visualizacao === 'meses') {
      anoCalendario++;
    } else {
      mesCalendario++;

      if (mesCalendario > 11) {
        mesCalendario = 0;
        anoCalendario++;
      }

      diaSelecionado = 0;
    }

    render();
  });

})();
</script>
